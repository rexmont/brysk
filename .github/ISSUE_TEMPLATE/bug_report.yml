name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! A screenshot and the steps to make it happen help the most.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did Brysk do instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder with …
        2. Press …
        3. …
  - type: input
    id: version
    attributes:
      label: Brysk version
      description: Find this in Settings → About.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS version and Mac model
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: Settings → About → "Open log and settings folder" has the log. Paste the relevant lines or attach a screenshot.
